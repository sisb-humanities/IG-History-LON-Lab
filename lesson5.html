<title>Lesson 5 · Why did the League fail?</title>

<script>
LAB.start({
 n:5, pages:"Walsh pp.52–53", title:"Why did the League of Nations fail?",
 target:"ONE paragraph: your mark out of 100 for the League. Mark first, then a success, a failure, and why one matters more.",
 wire:[["1920","The League begins work in Geneva"],["1925","Locarno: the League's high point?"],["1931","Japan invades Manchuria"],["1933","Germany and Japan leave the League"],["1935","Italy invades Abyssinia"]],
 tabs:[
 {id:"warm",label:"Warm-up",blocks:[
  {type:"flash",h:"The FAILURE memory aid",intro:"Each letter is one reason the League failed. <b>U</b> (Unfair treaty) is covered in Chapter 3.",cards:[
   {q:"F",a:"French and British self-interest: they put their own interests first."},
   {q:"A",a:"Absent powers: the USA never joined; Germany and Japan left; the USSR joined late."},
   {q:"I",a:"Ineffective sanctions: no oil ban on Italy, no trade ban on Japan."},
   {q:"L",a:"Lack of armed forces: no army, so it relied on members."},
   {q:"R",a:"Reaching decisions too slowly: the Lytton Report took a year."},
   {q:"E",a:"Economic depression: countries looked after themselves and aggression rose."},
   {q:"U",a:"Unfair treaty: the Treaty of Versailles, covered in Chapter 3."}]},
  {type:"sort",h:"Which letter?",intro:"Match each fact to the weakness it shows.",
   bins:[{id:"F",label:"F"},{id:"A",label:"A"},{id:"I",label:"I"},{id:"L",label:"L"},{id:"R",label:"R"},{id:"E",label:"E"}],
   items:[
   {t:"Britain and France did not close the Suez Canal.",bin:"F",why:"Self-interest and fear of war."},
   {t:"The USA sold more oil to Italy.",bin:["A","I"],why:"The USA was outside the League, so sanctions failed."},
   {t:"The League banned arms and loans to Italy but not oil.",bin:"I",why:"Sanctions that did not bite."},
   {t:"The League could not send troops to Manchuria.",bin:"L",why:"It had no army."},
   {t:"It took a year for the Lytton Report.",bin:"R",why:"The delay let Japan finish."},
   {t:"Japan's silk exports to the USA collapsed.",bin:"E",why:"The Depression pushed Japan towards expansion."},
   {t:"Britain signed the Anglo-German Naval Agreement without France.",bin:"F",why:"Self-interest."},
   {t:"Germany left the League in 1933.",bin:"A",why:"A major power absent."},
   {t:"Italy invaded Abyssinia after a long delay on oil.",bin:["R","I"],why:"Slow, and ineffective."},
   {t:"Countries put up tariffs after 1929.",bin:"E",why:"The Depression."},
   {t:"The League asked members to provide forces and they refused.",bin:"L",why:"No army of its own."},
   {t:"Hoare and Laval made a secret deal behind the League's back.",bin:"F",why:"Britain and France acted in their own interests."}]}
 ]},
 {id:"check",label:"Check",blocks:[
  {type:"quiz",h:"Knowledge check",items:[
   {q:"Which of these is a weakness from the FAILURE list?",opts:["Lack of armed forces","Too many members","Too much money"],a:0,why:"The League had no army."},
   {q:"What does ‘A’ stand for?",opts:["Absent powers","Aggression","Agreement"],a:0,why:"The USA never joined."},
   {q:"The League's best successes were in…",opts:["Humanitarian work and small disputes in the 1920s","Stopping Japan","Stopping Mussolini"],a:0,why:"The Aaland Islands and the health and labour work."},
   {q:"When did the League first impose sanctions on a country?",opts:["On Italy, 1935","On Japan, 1931","In 1925"],a:0,why:"The first time, but with gaps."},
   {q:"When you explain your mark out of 100, what must come first?",opts:["Your judgement, in the first sentence","A history of the League","A quote from the textbook"],a:0,why:"Judgement first, as in every answer. In this task your judgement is your mark out of 100 and the reason for it."},
   {q:"Which would strengthen an answer about a success?",opts:["A precise fact such as 400,000 prisoners sent home","‘It did good things’","The year it was founded"],a:0,why:"Precision turns an opinion into evidence."}]},
  {type:"match",h:"Chapter 2 keywords",intro:"Eight terms from the Keywords box on p.53. Tap a word, then its meaning. Practise all twenty on the <a href='vocab.html'>Word Wall</a>.",pairs:[
   {t:"Article 10",d:"Members promise to protect each other from attack"},
   {t:"Collective security",d:"Members acting together to protect any member"},
   {t:"Moral condemnation",d:"Publicly saying an aggressor is wrong"},
   {t:"Trade sanctions",d:"Members stop trading with an aggressor"},
   {t:"Unanimous",d:"Everyone agrees, which made decisions slow"},
   {t:"Secretariat",d:"The League's civil service"},
   {t:"Isolationism",d:"The US policy of keeping out of other countries' affairs"},
   {t:"Tariffs",d:"Taxes on imported goods"}]}
 ]},
 {id:"think",label:"Think",blocks:[
  {type:"calibrate",h:"What mark out of 100?",intro:"Give the League up to 25 for each of its four aims. Open ‘Remind me’ if you need the evidence. Then answer the heckler.",
   aims:[
   {id:"agg",label:"Discourage aggression",facts:["Aaland Islands, 1921: success","Bulgaria, 1925: success","Vilna and Corfu: powerful states ignored it","Manchuria and Abyssinia: failure"]},
   {id:"co",label:"Encourage co-operation",facts:["Locarno, Dawes, Kellogg–Briand in the 1920s","Many agencies: ILO, health","Germany and Japan left, USA never joined"]},
   {id:"dis",label:"Encourage disarmament",facts:["Washington naval limits in the 1920s","The Disarmament Conference collapsed in 1933","Hitler rearmed"]},
   {id:"liv",label:"Improve living conditions",facts:["400,000 prisoners sent home","White lead banned","Institutes in Singapore, London, Denmark","200,000 slaves freed in Sierra Leone"]}],
   heck:["That is very generous. The League failed to stop Japan, Italy or Hitler.","Defend that. What are the best successes?","So you think it did half its job. Which half?","That sounds harsh. What about the humanitarian work and the 1920s?"]},
  {type:"sort",h:"Did it fail before Abyssinia?",intro:"The 10-mark homework (p.53, 1(c)): ‘The League of Nations had failed before the Abyssinian crisis even started.’ Does each fact support or challenge that?",
   bins:[{id:"s",label:"Supports",sub:"it had already failed"},{id:"c",label:"Challenges",sub:"it had not yet failed"}],
   items:[
   {t:"Japan invaded Manchuria and was not stopped (1931–33).",bin:"s",why:"A major aggressor went unpunished."},
   {t:"The Disarmament Conference collapsed in 1933.",bin:"s",why:"A central aim failed."},
   {t:"The USA never joined.",bin:"s",why:"A weakness from the start."},
   {t:"Germany and Japan left in 1933.",bin:"s",why:"Two great powers walked away."},
   {t:"Vilna and Corfu: powerful states ignored it.",bin:"s",why:"Even the 1920s showed weakness."},
   {t:"The League settled the Aaland Islands dispute in 1921.",bin:"c",why:"A real success."},
   {t:"The League settled the Bulgaria dispute in 1925.",bin:"c",why:"Another success."},
   {t:"Britain and France still imposed sanctions on Italy in 1935.",bin:"c",why:"They still tried to use the League."},
   {t:"The humanitarian agencies were still working.",bin:"c",why:"Its useful work continued."}]}
 ]},
 {id:"write",label:"Write",blocks:[
  {type:"brief",h:"Your mark",label:"Focus Task 2.9 Q7",mins:8,q:[{w:"Explain",m:"Give reasons. Not just a mark."}," your ",{w:"mark out of 100",m:"Your own judgement, in the first sentence."}," for the League of Nations."],
   rules:[["Start: ","I give the League ___ out of 100 because…"],["Success: ","one, with a precise fact."],["Failure: ","one, with a precise fact."],["End: ","overall, the failures / successes matter more because…"]],
   nudges:["Is the mark in the first sentence?","Is there one success AND one failure?","Does each have a precise fact?","Have you said which matters more, and why?"]}
 ]},
 {id:"review",label:"Review",blocks:[
  {type:"check",h:"Check your paragraph",items:["The mark is in the first sentence","One success with a precise fact","One failure with a precise fact","Says which matters more, and why","Ends by returning to the mark"],bands:[{min:0,t:"Keep going."},{min:3,t:"Getting there."},{min:4,t:"Strong."},{min:5,t:"Secure."}]},
  {type:"model",h:"Compare with a model",models:[{title:"Model: mark out of 100",q:"Explain your mark out of 100 for the League of Nations.",paras:[[
   {k:"p",t:"I give the League 40 out of 100 because its successes were real but it failed at its main purpose.",note:"The mark comes first."},
   {k:"e",t:"In the 1920s it sent about 400,000 prisoners of war home and settled the Aaland Islands dispute.",note:"A success with precise facts."},
   {k:"x",t:"This meant that it helped many people and could solve small disputes.",note:"Says what it meant."},
   {k:"e",t:"However, it did not stop Japan in Manchuria or Italy in Abyssinia.",note:"A failure, precisely."},
   {k:"x",t:"This meant that when great powers broke the rules, the League could not act.",note:"The consequence."},
   {k:"l",t:"Overall, the failures matter more because keeping peace was the League's main job.",note:"Which matters more, and why."}]]}]},
  {type:"twin",h:"Write another",twins:[{label:"Twin question",q:"Give the League a mark out of 100 for the <b>1920s only</b>. Explain it.",change:"A shorter time-frame, so the mark and the evidence both change.",mins:8,facts:["Aaland Islands, 1921","Bulgaria, 1925","Locarno, 1925","Humanitarian work","Vilna and Corfu"]}]}
 ]},
 {id:"essay",label:"10-marker",blocks:[
  {type:"info",kind:"warn",html:"<b>Homework: Practice Question 1(c), p.53.</b> ‘The League of Nations had failed before the Abyssinian crisis even started.’ How far do you agree with this statement? Explain your answer. [10]"},
  {type:"quiz",h:"Before you plan",intro:"Three checks on what this question is really asking.",items:[
   {q:"The statement is about the League <b>before</b> Abyssinia. Which evidence belongs in your AGREE paragraph?",opts:["The Hoare–Laval Pact, 1935","Manchuria, 1931–33, and the Disarmament Conference","The Peace Ballot"],a:1,why:"Agreeing means showing it had already failed before 1935. Many students write only about Abyssinia and miss this."},
   {q:"Which evidence best supports DISAGREEING?",opts:["Japan resigned from the League in 1933","Many people still believed in the League in 1935: the Peace Ballot","Germany left the League in 1933"],a:1,why:"If people still had faith in it in 1935, it had not yet completely failed."},
   {q:"Which is the best opening sentence?",opts:["The League of Nations was set up in 1920.","I partly agree: the League was badly damaged by 1935, but Abyssinia was when its failure became complete.","There are many reasons why the League failed."],a:1,why:"Judgement first, with the reason. ‘How far’ needs a level of agreement."}]},
  {type:"brief",h:"Write the answer",label:"Practice Question 1(c)",mins:20,q:["‘The League of Nations had ",{w:"failed",m:"Not ‘had problems’. Failed at its main purpose: keeping the peace."}," ",{w:"before",m:"The key word. The statement is about the time before October 1935."}," the Abyssinian crisis even started.’ ",{w:"How far",m:"Give a level: completely, mostly, partly, hardly. Say it first."}," do you agree with this statement? Explain your answer. [10]"],
   rules:[["Judgement: ","how far you agree, and why, in one or two sentences."],["Agree: ","failures before 1935, with precise facts, each explained."],["Disagree: ","why it had not yet completely failed, with precise facts."],["Conclusion: ","answer ‘how far’ again, using the timing in the question."]],
   nudges:["Is Manchuria in your agree paragraph?","Have you used a date to show that each event came before October 1935?","Does your disagree paragraph say why Abyssinia was different, or why people still believed in the League?","Does your conclusion say how far, not just yes or no?"]},
  {type:"check",h:"Check your answer",items:["Judgement is in the first sentence and answers ‘how far’","Agree paragraph uses events BEFORE 1935 (Manchuria, disarmament)","Each agree point is explained, not just listed","Disagree paragraph says why the League had not yet completely failed","Precise facts in both paragraphs (dates, names, numbers)","Conclusion repeats the judgement with a reason"],bands:[{min:0,t:"Keep going."},{min:3,t:"A one-sided answer usually sits here. Make sure both sides are explained."},{min:5,t:"Strong."},{min:6,t:"Secure."}]},
  {type:"model",h:"Compare with a model",models:[{title:"Model: 10 marks",q:"‘The League of Nations had failed before the Abyssinian crisis even started.’ How far do you agree with this statement? Explain your answer. [10]",paras:[[
   {k:"p",t:"I partly agree.",note:"How far, in three words."},
   {k:"p",t:"By 1935 the League was already badly damaged, but Abyssinia was the moment its failure became complete.",note:"The reason for the judgement, using the timing in the question."}],[
   {k:"p",t:"On the one hand, the League had failed several times before 1935.",note:"The agree paragraph opens with its point."},
   {k:"e",t:"It largely failed to bring about disarmament, and in 1933 Hitler took Germany out of the Disarmament Conference and the League.",note:"Precise and dated before 1935."},
   {k:"e",t:"More seriously, in 1931 Japan, a leading member, invaded Manchuria.",note:"The strongest evidence for agreeing."},
   {k:"x",t:"The League took over a year to report, and no sanctions were imposed because the USA was Japan’s main trading partner and Britain and France would not risk war. This meant that Japan simply resigned in 1933 and kept Manchuria.",note:"Explains how this was a failure, not just what happened."},
   {k:"x",t:"Walsh says Hitler and Mussolini “looked on with interest”, so the League’s weakness had already been exposed.",note:"Links the failure to what came next."}],[
   {k:"p",t:"On the other hand, Abyssinia was “the fatal blow” (p.48).",note:"The disagree paragraph opens with its point."},
   {k:"e",t:"Unlike Manchuria, it was on the League’s doorstep and a clear case of a powerful state attacking a smaller one.",note:"A precise contrast with Manchuria."},
   {k:"x",t:"This meant that the League was “ideally placed to act”, so it had not yet been properly tested.",note:"Explains why it had not yet failed."},
   {k:"e",t:"Many people still believed in it: the Peace Ballot showed that most British people would support force to defend Abyssinia.",note:"Evidence that faith in the League survived until 1935."},
   {k:"x",t:"Only when Britain and France refused to ban oil or close the Suez Canal, and made the Hoare–Laval deal, was that faith destroyed.",note:"Shows when the failure became complete."}],[
   {k:"l",t:"Overall, the League was already weak before 1935, but it had not yet clearly failed when tested by a European power. Abyssinia confirmed the failure.",note:"The conclusion answers ‘how far’ again and uses the question’s timing."}]],
   }],after:"<b>The trap:</b> the statement is about the League <i>before</i> Abyssinia. Answers that write only about Abyssinia miss half the question."},
  {type:"twin",h:"Write another",twins:[{label:"Practice question",q:"‘The Manchurian crisis did more damage to the League than the Abyssinian crisis.’ How far do you agree with this statement? Explain your answer. [10]",change:"The same two crises, but now you weigh them against each other.",mins:20,facts:["Manchuria: far from Europe; Japan resigned in 1933 and kept Manchuria","Abyssinia: on the League’s doorstep; no oil ban, Suez left open, Hoare–Laval","From 1936 the League was seen as irrelevant (Chapter Summary, p.53)"]}]}
 ]}
 ]
});
</script></body></html>
