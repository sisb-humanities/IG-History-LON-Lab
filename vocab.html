<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>League Word Wall</title>
<style>
:root{
  --board:#1F4FA0; --tb:#2E8B3E; --nb:#D35400; --yellow:#FFD23F;
  --dark:#22252B; --ink:#1E1E24; --pale:#F1F3F6; --mute:#8A93A6; --line:#C9CED8; --white:#fff;
  --ok:#2E8B3E; --no:#C0392B;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Arial,Helvetica,sans-serif;background:var(--pale);color:var(--ink);min-height:100vh}
button{font:inherit;cursor:pointer}
.top{background:var(--dark);color:#fff}
.top .wrap{display:flex;align-items:center;gap:14px;padding:12px 16px}
.logo{height:42px;background:#fff;border-radius:6px;padding:3px 8px}
.top .t{font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--line)}
.top a{color:var(--yellow);text-decoration:none;font-size:13px;margin-left:auto;white-space:nowrap}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
.hero{background:var(--dark);color:#fff;padding:8px 0 26px}
.hero h1{margin:6px 0 4px;font-size:clamp(28px,5vw,40px)}
.hero p{margin:0;color:var(--line)}
.pill{display:inline-block;border-radius:999px;padding:5px 14px;font-weight:700;font-size:13px;background:#fff;color:var(--board)}
.pill.y{background:var(--yellow);color:var(--ink)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 6px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--dark);border-color:var(--dark);color:#fff}
.count{color:var(--mute);font-size:13px;margin-bottom:12px}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:18px}
.mode{border:0;border-radius:14px;color:#fff;text-align:left;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.18);min-height:96px;display:flex;flex-direction:column;gap:4px;transition:transform .12s}
.mode:hover{transform:translateY(-2px)}
.mode b{font-size:18px}.mode span{font-size:13px;opacity:.92}
.mode[aria-pressed=true]{outline:4px solid var(--yellow);outline-offset:2px}
.m-board{background:var(--board)}.m-tb{background:var(--tb)}.m-nb{background:var(--nb)}.m-dark{background:var(--dark)}.m-y{background:var(--yellow);color:var(--ink)}
.stage{background:#fff;border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.12);padding:20px;margin-bottom:40px;min-height:320px}
.stage h2{margin:0 0 4px;font-size:22px}
.sub{color:var(--mute);font-size:14px;margin:0 0 14px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.stat{background:var(--pale);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px}
.btn{border:0;border-radius:10px;padding:10px 18px;font-weight:700;background:var(--dark);color:#fff}
.btn.alt{background:var(--pale);color:var(--ink)}
.btn.go{background:var(--board)}
.btn:disabled{opacity:.4;cursor:default}
/* flashcards */
.flip{perspective:1000px;margin:0 auto 14px;max-width:620px}
.flip .in{position:relative;height:240px;transition:transform .45s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.front{background:var(--board);color:#fff;font-size:clamp(24px,4vw,34px);font-weight:700}
.face.back{background:var(--pale);border:3px solid var(--board);transform:rotateY(180deg);font-size:19px;line-height:1.45}
.face small{display:block;font-size:13px;font-weight:700;opacity:.8;margin-top:10px;letter-spacing:.06em;text-transform:uppercase}
.center{text-align:center}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
/* match */
.cols{display:grid;grid-template-columns:1fr 1.6fr;gap:12px}
.tile{width:100%;border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px;text-align:left;margin-bottom:10px;font-size:15px;line-height:1.35;color:var(--ink);transition:background .15s}
.tile.term{font-weight:700;font-size:16px}
.tile.sel{border-color:var(--board);background:#E6EDF8}
.tile.done{background:#E3F2E6;border-color:var(--tb);color:#1d5b28;cursor:default}
.tile.bad{animation:shake .35s;border-color:var(--no)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* quiz */
.q{background:var(--pale);border-left:6px solid var(--nb);border-radius:10px;padding:16px;font-size:19px;line-height:1.45;margin-bottom:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:0;border-radius:12px;padding:16px;color:#fff;font-weight:700;font-size:16px;text-align:left;min-height:64px}
.opt:nth-child(1){background:var(--board)}.opt:nth-child(2){background:var(--tb)}.opt:nth-child(3){background:var(--nb)}.opt:nth-child(4){background:var(--dark)}
.opt.wrong{opacity:.35}.opt.right{outline:4px solid var(--yellow);outline-offset:2px}
.fb{margin-top:12px;border-radius:10px;padding:10px 14px;font-weight:700}
.fb.ok{background:#E3F2E6;color:#1d5b28}.fb.no{background:#FBE6E3;color:#8e2a1f}
/* anagram */
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:14px 0}
.slot,.let{width:42px;height:48px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px}
.slot{border:2px dashed var(--line);background:#fff}
.slot.f{border-style:solid;border-color:var(--nb);background:#FFF1E6}
.let{border:0;background:var(--nb);color:#fff;box-shadow:0 2px 0 #9c3d00}
.let:disabled{opacity:.2}
/* true/false */
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.tf button{border:0;border-radius:14px;padding:22px;font-size:22px;font-weight:700;color:#fff}
.tf .t{background:var(--tb)}.tf .f{background:var(--no)}
.tfcard{background:var(--pale);border-radius:14px;padding:18px;text-align:center}
.tfcard .w{font-size:26px;font-weight:700;color:var(--board);margin-bottom:8px}
.tfcard .d{font-size:18px;line-height:1.45}
.timer{height:10px;background:var(--pale);border-radius:999px;overflow:hidden;margin-bottom:12px}
.timer i{display:block;height:100%;background:var(--yellow);width:100%;transition:width 1s linear}
/* list */
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--dark);color:#fff;font-size:13px;letter-spacing:.05em;text-transform:uppercase}
td.w{font-weight:700;color:var(--board);white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--pale);color:var(--mute)}
.done-box{text-align:center;padding:30px 10px}
.done-box .big{font-size:46px;font-weight:700;color:var(--board)}
.foot{color:var(--mute);font-size:12px;text-align:center;padding:0 16px 30px}
@media (max-width:620px){
  .cols{grid-template-columns:1fr}
  .opts{grid-template-columns:1fr}
  .top .t{display:none}
  td.w{white-space:normal}
}
</style>
</head>

<script>
(function(){
"use strict";
var WORDS=[
 /* lesson, word, definition */
 [0,"Covenant","The set of rules that every League member agreed to follow."],
 [0,"Assembly","The League’s ‘parliament’, where every member country had one vote."],
 [0,"Council","The smaller League body of the most powerful members. It met more often and dealt with crises."],
 [0,"Collective security","The idea that members act together to protect any member that is attacked."],
 [1,"Humanitarian","Work that improves people’s lives and welfare, such as health, refugees and working conditions."],
 [1,"ILO","The International Labour Organization. It worked to improve working conditions, for example banning poisonous white lead in paint."],
 [1,"Refugees","People forced to leave their homes. The League’s committee sent about 400,000 prisoners of war home."],
 [1,"Slavery Commission","The League body that worked to end slavery and forced labour. It helped free 200,000 slaves in Sierra Leone."],
 [1,"Health Committee","The League body that set up research institutes in Singapore, London and Denmark. It later became the WHO."],
 [1,"Dawes Plan","The 1924 plan that used American loans to help Germany pay reparations."],
 [1,"Locarno Treaties","The 1925 agreements in which Germany accepted its western borders."],
 [1,"Kellogg–Briand Pact","The 1928 agreement in which over 60 countries promised not to use war to settle disputes."],
 [2,"Wall Street Crash","The collapse of the American stock market in October 1929 that began the Depression."],
 [2,"Depression","The worldwide economic slump after 1929, with mass unemployment and falling trade."],
 [2,"Tariffs","Taxes on imported goods. Countries raised them after 1929, so world trade fell further."],
 [2,"Manchuria","The region of north-east China, rich in raw materials, that Japan invaded in 1931."],
 [2,"Mukden Incident","The 1931 explosion on the Japanese-controlled railway near Mukden. Japan blamed China and used it as an excuse to invade."],
 [2,"Lytton Report","The League’s inquiry into Manchuria. It took a year and said Japan should withdraw."],
 [2,"Aggressor","A country that attacks another country."],
 [3,"Disarmament","Reducing the number of weapons and the size of armed forces."],
 [3,"Disarmament Conference","The League’s meeting from 1932 to try to reduce arms. It collapsed after Germany left in 1933."],
 [3,"Rearmament","Building up weapons and armed forces again. Hitler began this after 1933."],
 [4,"Sanctions","Measures, such as banning trade, used to pressure or punish a country."],
 [4,"Abyssinia","The independent African country (now Ethiopia) that Italy invaded in October 1935."],
 [4,"Stresa Pact","The 1935 agreement between Britain, France and Italy to stand together against German rearmament."],
 [4,"Hoare–Laval Pact","The secret 1935 plan by Britain and France to give Italy two-thirds of Abyssinia."],
 [4,"Suez Canal","The waterway owned by Britain and France. They did not close it to Italy’s supply ships."],
 [4,"Annex","To take over another country’s territory and make it part of your own."],
 [4,"Rhineland","The German area next to France. Hitler sent troops there in March 1936, breaking the Treaty of Versailles."],
 [5,"Isolationism","The US policy of keeping out of other countries’ affairs, which kept the USA out of the League."],
 [5,"Self-interest","Putting your own country’s needs first instead of acting together."],
 [5,"Absent powers","The great powers missing from the League, such as the USA, which never joined."]
];
var LESSON=["Part 1 recap","Lesson 1","Lesson 2","Lesson 3","Lesson 4","Lesson 5"];
var KEY="g9lon-wordwall";
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(o){try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}}
var prefs=load();
var on=prefs.on||[0,1,2,3,4,5];
var mode=prefs.mode||"cards";
var timers=[];
function clearTimers(){timers.forEach(function(t){clearInterval(t);clearTimeout(t)});timers=[]}
function log(a,d){try{if(window.SISB_TRACKER&&window.SISB_TRACKER.log)window.SISB_TRACKER.log("G9 HIST LON",a,d)}catch(e){}}
function h(tag,attrs){var e=document.createElement(tag);if(attrs)for(var k in attrs){var v=attrs[k];if(v==null||v===false)continue;
  if(k==="class")e.className=v;else if(k==="html")e.innerHTML=v;else if(k.slice(0,2)==="on")e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?"":v)}
  for(var i=2;i<arguments.length;i++){var c=arguments[i];if(c==null||c===false)continue;if(Array.isArray(c))c.forEach(function(x){if(x!=null)e.appendChild(x.nodeType?x:document.createTextNode(x))});else e.appendChild(c.nodeType?c:document.createTextNode(c))}return e}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function pool(){return WORDS.filter(function(w){return on.indexOf(w[0])>-1}).map(function(w){return {l:w[0],w:w[1],d:w[2]}})}
var stage=document.getElementById("stage");

/* ---------- filters ---------- */
function drawFilters(){
  var f=document.getElementById("filters");f.innerHTML="";
  f.append(h("button",{class:"chip","aria-pressed":on.length===6?"true":"false",onclick:function(){on=[0,1,2,3,4,5];changed()}},"All"));
  LESSON.forEach(function(name,i){
    f.append(h("button",{class:"chip","aria-pressed":(on.length<6&&on.indexOf(i)>-1)?"true":"false",onclick:function(){
      if(on.length===6)on=[i];else if(on.indexOf(i)>-1){on=on.filter(function(x){return x!==i});if(!on.length)on=[0,1,2,3,4,5]}else on.push(i);
      changed()}},name));
  });
  document.getElementById("count").textContent=pool().length+" words selected";
}
function changed(){prefs.on=on;save(prefs);drawFilters();run()}

/* ---------- modes ---------- */
var MODES=[
 {id:"cards",name:"Flashcards",desc:"Flip and learn",cls:"m-board"},
 {id:"match",name:"Match up",desc:"Word to meaning",cls:"m-tb"},
 {id:"quiz",name:"Quiz",desc:"Which word is it?",cls:"m-nb"},
 {id:"spell",name:"Anagram",desc:"Unscramble the word",cls:"m-y"},
 {id:"tf",name:"True or false",desc:"60-second blitz",cls:"m-dark"},
 {id:"list",name:"Word list",desc:"See them all",cls:"m-board"}
];
function drawModes(){
  var m=document.getElementById("modes");m.innerHTML="";
  MODES.forEach(function(x){m.append(h("button",{class:"mode "+x.cls,"aria-pressed":mode===x.id?"true":"false",onclick:function(){mode=x.id;prefs.mode=mode;save(prefs);drawModes();run();stage.scrollIntoView({behavior:"smooth",block:"start"})}},h("b",null,x.name),h("span",null,x.desc)))});
}
function run(){clearTimers();stage.innerHTML="";var p=pool();
  if(mode==="spell")p=p.filter(function(x){return /^[A-Za-z]+$/.test(x.w)&&x.w.length<=12});
  if(p.length<2){stage.append(h("p",null,mode==="spell"?"Anagram uses one-word terms only. Choose more lessons.":"Choose more lessons to play."));return}
  ({cards:cards,match:match,quiz:quiz,spell:spell,tf:tf,list:list})[mode](p)}
function head(t,s){stage.append(h("h2",null,t),h("p",{class:"sub"},s))}
function finish(score,total,again,label){
  var best=prefs.best||{};var k=mode;var pct=Math.round(score/Math.max(total,1)*100);
  var nb=!best[k]||pct>best[k];if(nb){best[k]=pct;prefs.best=best;save(prefs)}
  log(mode,score+"/"+total);
  stage.append(h("div",{class:"done-box"},h("div",{class:"big"},score+" / "+total),h("p",null,label||(pct>=80?"Excellent recall.":pct>=50?"Good. Go again to beat it.":"Keep practising: try the flashcards first.")),
    h("p",{class:"sub"},nb?"New personal best on this device.":"Your best: "+best[k]+"%"),
    h("button",{class:"btn go",onclick:again},"Play again")));
}

/* flashcards */
function cards(p){
  var deck=shuffle(p),i=0,dir="word";
  head("Flashcards","Say the answer out loud before you flip. Use the arrow keys or the buttons.");
  var bar=h("div",{class:"bar"}),body=h("div");stage.append(bar,body);
  var swap=h("button",{class:"btn alt",onclick:function(){dir=dir==="word"?"def":"word";swap.textContent=dir==="word"?"Show meaning first":"Show word first";draw()}},"Show meaning first");
  var stat=h("span",{class:"stat"});
  bar.append(stat,h("button",{class:"btn alt",onclick:function(){deck=shuffle(p);i=0;draw()}},"Shuffle"),swap);
  function draw(){var c=deck[i];stat.textContent=(i+1)+" / "+deck.length;body.innerHTML="";
    var fr=dir==="word"?[c.w,LESSON[c.l]]:[c.d,"What is the word?"],bk=dir==="word"?[c.d,c.w]:[c.w,LESSON[c.l]];
    var fl=h("div",{class:"flip",role:"button",tabindex:"0","aria-label":"Flip card",onclick:function(){fl.classList.toggle("on")},onkeydown:function(e){if(e.key===" "||e.key==="Enter"){e.preventDefault();fl.classList.toggle("on")}}},
      h("div",{class:"in"},h("div",{class:"face front",style:dir==="def"?"font-size:20px;font-weight:400;line-height:1.45":""},fr[0],h("small",null,fr[1])),h("div",{class:"face back"},bk[0],h("small",null,bk[1]))));
    body.append(fl,h("div",{class:"row"},h("button",{class:"btn alt",disabled:i===0,onclick:function(){i--;draw()}},"← Back"),h("button",{class:"btn go",onclick:function(){i=(i+1)%deck.length;draw()}},"Next →")));
  }
  document.onkeydown=function(e){if(mode!=="cards")return;if(e.key==="ArrowRight"){i=(i+1)%deck.length;draw()}else if(e.key==="ArrowLeft"&&i>0){i--;draw()}};
  draw();
}
/* match up: rounds of 6 */
function match(p){
  var deck=shuffle(p),round=0,rounds=Math.ceil(deck.length/6),mistakes=0,start=Date.now();
  head("Match up","Tap a word, then tap its meaning. Six at a time.");
  var stat=h("span",{class:"stat"}),time=h("span",{class:"stat"}),body=h("div");stage.append(h("div",{class:"bar"},stat,time),body);
  timers.push(setInterval(function(){time.textContent="⏱ "+Math.round((Date.now()-start)/1000)+"s"},1000));time.textContent="⏱ 0s";
  function draw(){
    var set=deck.slice(round*6,round*6+6);if(set.length<2&&round>0){set=deck.slice(-6)}
    stat.textContent="Round "+(round+1)+" of "+rounds+" · mistakes: "+mistakes;
    body.innerHTML="";var sel=null,left=set.length;
    var L=h("div"),R=h("div");
    function pick(t,side,item){if(t.classList.contains("done"))return;
      if(!sel||sel.side===side){if(sel)sel.t.classList.remove("sel");sel={t:t,side:side,item:item};t.classList.add("sel");return}
      if(sel.item===item){sel.t.classList.remove("sel");sel.t.classList.add("done");t.classList.add("done");sel=null;left--;
        if(!left){round++;if(round>=rounds){clearTimers();var secs=Math.round((Date.now()-start)/1000);body.innerHTML="";
          finish(deck.length-Math.min(mistakes,deck.length),deck.length,function(){run()},"Finished in "+secs+" seconds with "+mistakes+" mistake"+(mistakes===1?"":"s")+".");}
          else setTimeout(draw,450)}}
      else{mistakes++;stat.textContent="Round "+(round+1)+" of "+rounds+" · mistakes: "+mistakes;var a=sel.t;a.classList.remove("sel");sel=null;[a,t].forEach(function(x){x.classList.add("bad");setTimeout(function(){x.classList.remove("bad")},360)})}}
    shuffle(set).forEach(function(it){var t=h("button",{class:"tile term"},it.w);t.onclick=function(){pick(t,"w",it)};L.append(t)});
    shuffle(set).forEach(function(it){var t=h("button",{class:"tile"},it.d);t.onclick=function(){pick(t,"d",it)};R.append(t)});
    body.append(h("div",{class:"cols"},L,R));
  }
  draw();
}
/* quiz */
function quiz(p){
  var deck=shuffle(p).slice(0,Math.min(12,p.length)),i=0,score=0,all=WORDS.map(function(w){return w[1]});
  head("Quiz","Read the meaning. Choose the word. "+deck.length+" questions.");
  var stat=h("span",{class:"stat"}),body=h("div");stage.append(h("div",{class:"bar"},stat),body);
  function draw(){
    if(i>=deck.length){body.innerHTML="";stat.textContent="Done";finish(score,deck.length,function(){run()});return}
    var c=deck[i],wrong=shuffle(p.filter(function(x){return x.w!==c.w}).map(function(x){return x.w}));
    if(wrong.length<3)wrong=wrong.concat(shuffle(all.filter(function(w){return w!==c.w&&wrong.indexOf(w)<0})));
    var opts=shuffle([c.w].concat(wrong.slice(0,3))),done=false;
    stat.textContent="Question "+(i+1)+" / "+deck.length+" · score "+score;
    body.innerHTML="";var fb=h("div"),grid=h("div",{class:"opts"});
    opts.forEach(function(o){var b=h("button",{class:"opt"},o);b.onclick=function(){if(done)return;done=true;
      var ok=o===c.w;if(ok)score++;
      Array.prototype.forEach.call(grid.children,function(x){if(x.textContent===c.w)x.classList.add("right");else x.classList.add("wrong")});
      fb.append(h("div",{class:"fb "+(ok?"ok":"no")},ok?"✓ Correct":"✗ It was: "+c.w),h("div",{class:"row",style:"margin-top:12px"},h("button",{class:"btn go",onclick:function(){i++;draw()}},i+1<deck.length?"Next":"See score")));};grid.append(b)});
    body.append(h("div",{class:"q"},c.d),grid,fb);
  }
  draw();
}
/* anagram */
function spell(p){
  var deck=shuffle(p).slice(0,Math.min(8,p.length)),i=0,score=0;
  head("Anagram","Read the meaning, then tap the letters in order. One-word terms only.");
  var stat=h("span",{class:"stat"}),body=h("div");stage.append(h("div",{class:"bar"},stat),body);
  function draw(){
    if(i>=deck.length){body.innerHTML="";stat.textContent="Done";finish(score,deck.length,function(){run()});return}
    var c=deck[i],target=c.w.toUpperCase(),typed=[],used=[],hinted=false;
    stat.textContent="Word "+(i+1)+" / "+deck.length+" · score "+score;
    body.innerHTML="";
    var slots=h("div",{class:"slots"}),letters=h("div",{class:"slots"}),fb=h("div");
    var mix;do{mix=shuffle(target.split(""))}while(mix.join("")===target&&target.length>1);
    function paint(){slots.innerHTML="";for(var k=0;k<target.length;k++)slots.append(h("div",{class:"slot"+(typed[k]?" f":"")},typed[k]?typed[k].ch:""));
      Array.prototype.forEach.call(letters.children,function(b,k){b.disabled=used.indexOf(k)>-1})}
    mix.forEach(function(ch,k){letters.append(h("button",{class:"let",onclick:function(){if(typed.length>=target.length)return;typed.push({ch:ch,k:k});used.push(k);paint();
      if(typed.length===target.length){var got=typed.map(function(t){return t.ch}).join("");
        if(got===target){if(!hinted)score++;fb.innerHTML="";fb.append(h("div",{class:"fb ok"},"✓ "+c.w+(hinted?" (with a hint, no point)":"")),h("div",{class:"row",style:"margin-top:12px"},h("button",{class:"btn go",onclick:function(){i++;draw()}},"Next")))}
        else{fb.innerHTML="";fb.append(h("div",{class:"fb no"},"Not quite. Undo some letters and try again."))}}}},ch))});
    var undo=h("button",{class:"btn alt",onclick:function(){var t=typed.pop();if(t){used=used.filter(function(u){return u!==t.k})}fb.innerHTML="";paint()}},"Undo");
    var hint=h("button",{class:"btn alt",onclick:function(){hinted=true;fb.innerHTML="";fb.append(h("div",{class:"fb no"},"Starts with "+target[0]+" · "+target.length+" letters"))}},"Hint");
    var skip=h("button",{class:"btn alt",onclick:function(){fb.innerHTML="";fb.append(h("div",{class:"fb no"},"It was: "+c.w),h("div",{class:"row",style:"margin-top:12px"},h("button",{class:"btn go",onclick:function(){i++;draw()}},"Next")));letters.querySelectorAll("button").forEach(function(b){b.disabled=true})}},"Give up");
    body.append(h("div",{class:"q"},c.d),slots,letters,h("div",{class:"row"},undo,hint,skip),fb);paint();
  }
  draw();
}
/* true or false blitz */
function tf(p){
  var score=0,n=0,left=60,cur=null,running=false;
  head("True or false","Does the meaning match the word? Score as many as you can in 60 seconds.");
  var stat=h("span",{class:"stat"},"Score 0"),tm=h("span",{class:"stat"},"60s"),bar=h("div",{class:"timer"},h("i")),body=h("div");
  stage.append(h("div",{class:"bar"},stat,tm),bar,body);
  function next(){var a=p[Math.floor(Math.random()*p.length)],truth=Math.random()<.5,d=a.d;
    if(!truth){var o=shuffle(p.filter(function(x){return x.w!==a.w}))[0];d=o.d}
    cur={truth:truth};body.innerHTML="";
    var card=h("div",{class:"tfcard"},h("div",{class:"w"},a.w),h("div",{class:"d"},d));
    body.append(card,h("div",{class:"tf"},h("button",{class:"t",onclick:function(){ans(true)}},"✓ True"),h("button",{class:"f",onclick:function(){ans(false)}},"✗ False")));}
  function ans(v){if(!running)return;n++;if(v===cur.truth){score++;stat.textContent="Score "+score}else{stat.textContent="Score "+score+" · last one wrong"}next()}
  body.append(h("div",{class:"center"},h("button",{class:"btn go",onclick:function(){running=true;next();
    timers.push(setInterval(function(){left--;tm.textContent=left+"s";bar.firstChild.style.width=(left/60*100)+"%";
      if(left<=0){running=false;clearTimers();body.innerHTML="";finish(score,n,function(){run()},n?"You answered "+n+" and got "+score+" right.":"No answers this time.")}},1000))}},"Start")));
}
/* list */
function list(p){
  head("Word list","Every word and meaning. Good for checking your notebook.");
  var t=h("table",null,h("tr",null,h("th",null,"Word"),h("th",null,"Meaning"),h("th",null,"")));
  p.forEach(function(x){t.append(h("tr",null,h("td",{class:"w"},x.w),h("td",null,x.d),h("td",null,h("span",{class:"tag"},LESSON[x.l]))))});
  stage.append(t);
}
drawFilters();drawModes();run();
window.WW={words:WORDS,run:run};
})();
