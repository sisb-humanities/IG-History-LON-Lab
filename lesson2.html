<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lesson 2 · The Depression and Manchuria</title>
<link rel="stylesheet" href="assets/style.css"></head>
<body><div id="app"></div>
<script src="assets/lab.js"></script>
<script>
LAB.start({
 n:2, pages:"Walsh pp.42–45", title:"The Depression and the Manchurian crisis",
 target:"TWO paragraphs. (a) how the Depression made the League's work harder. (b) why Japan invaded Manchuria.",
 wire:[["Oct 1929","Wall Street Crash: American loans to Europe dry up"],["1930s","Countries raise tariffs. World trade falls"],["Sep 1931","Mukden Incident. Japanese troops move into Manchuria"],["Feb 1933","Assembly approves the Lytton Report 42–1"],["Mar 1933","Japan resigns from the League"]],
 tabs:[
 {id:"warm",label:"Warm-up",blocks:[
  {type:"order",h:"Manchuria timeline",intro:"Tap the events in the order they happened.",prompt:"Tap the earliest event first",
   items:[{t:"Mukden Incident and the invasion of Manchuria (1931)",note:"Japanese army officers blew up a section of the railway they controlled."},
   {t:"The Lytton Report is presented (September 1932)",note:"A year after the invasion."},
   {t:"The Assembly approves the report, 42 votes to 1 (24 February 1933)",note:"Only Japan voted against."},
   {t:"Japan resigns from the League (27 March 1933)",note:"The League had no way to force it to leave Manchuria."},
   {t:"Japan invades Jehol (the following week)",note:"The aggression continued."}],after:"Notice the gap between 1931 and 1933: the League took a long time."},
  {type:"flash",h:"Key facts",cards:[
   {q:"Who controlled the South Manchurian Railway?",a:"Japan."},
   {q:"What did Manchuria offer Japan?",a:"Raw materials (iron, coal, timber), farmland and a market for Japanese goods."},
   {q:"What was the vote on the Lytton Report?",a:"42 to 1 in the Assembly, 24 February 1933."},
   {q:"What did Japan do on 27 March 1933?",a:"Resigned from the League."},
   {q:"Why was Manchuria a long way from Geneva a problem?",a:"Slow communication and no League force nearby. Britain and France were far from the area."},
   {q:"How did the Depression hit Japan?",a:"Silk exports to the USA collapsed, which hurt farmers and strengthened army nationalists."}]}
 ]},
 {id:"check",label:"Check",blocks:[
  {type:"quiz",h:"Knowledge check",items:[
   {q:"What started the worldwide Depression?",opts:["The Mukden Incident","The Wall Street Crash, 1929","The Lytton Report"],a:1,why:"The Crash in October 1929 began the chain."},
   {q:"Why did the end of American loans matter so much?",opts:["Germany could no longer join the League","Businesses went bankrupt and unemployment rose","Japan invaded China"],a:1,why:"The Dawes Plan (1924) depended on American loans. When they stopped, European economies suffered."},
   {q:"What are tariffs?",opts:["Taxes on imported goods","Weapons treaties","League committees"],a:0,why:"Tariffs made trade fall further because partners hit back with their own."},
   {q:"Who controlled the South Manchurian Railway?",opts:["China","Britain","Japan"],a:2,why:"Japan's control gave it troops and interests in the region."},
   {q:"What did the League's Lytton Report say?",opts:["Japan was in the wrong and should withdraw","China had attacked first","The League should ban all trade with Japan"],a:0,why:"The League condemned Japan, but had no means to enforce it."},
   {q:"What was the Assembly vote in February 1933?",opts:["42 to 1","10 to 9","All in favour"],a:0,why:"Overwhelming condemnation, but only words."},
   {q:"What did Japan do after the vote?",opts:["Withdrew its army","Resigned from the League","Asked for a new inquiry"],a:1,why:"Japan resigned on 27 March 1933 and invaded Jehol the next week."},
   {q:"Why would sanctions on Japan have been meaningless?",opts:["They were illegal","The USA, a major trading partner, was not in the League","Japan had no trade"],a:1,why:"Japan could trade with the USA. Always explain WHY, not just ‘the USA was not a member’."}]},
  {type:"sort",h:"Describe or explain?",intro:"Examiners reward <b>explanation</b>. Decide whether each sentence only describes what happened, or explains how one thing led to another.",
   bins:[{id:"d",label:"Describes"},{id:"x",label:"Explains"}],
   items:[
   {t:"Japan's silk exports to the USA fell sharply.",bin:"d",why:"A fact. No ‘so’ or ‘which meant’."},
   {t:"Silk exports fell, so farmers lost income, which helped army leaders argue for seizing Manchuria's resources.",bin:"x",why:"It links cause to consequence."},
   {t:"The Wall Street Crash happened in 1929.",bin:"d",why:"A date and an event."},
   {t:"US loans stopped, so German businesses went bankrupt, which pushed up unemployment and helped extremist parties.",bin:"x",why:"A chain of cause and effect."},
   {t:"Countries put up tariffs.",bin:"d",why:"What happened, not why it mattered."},
   {t:"Tariffs made trading partners do the same, so trade fell further and countries cared less about the League.",bin:"x",why:"It links to the League."},
   {t:"Britain and the USA gave international disputes a low priority.",bin:"d",why:"A statement of priorities."},
   {t:"Britain and the USA were busy with their own economies, so no one was ready to stand up to Japan.",bin:"x",why:"It connects the situation to the League's failure."}]},
  {type:"quiz",h:"Which is the most precise?",intro:"Three questions. Choose the sentence a top-band answer would use.",items:[
   {q:"Which is the most precise evidence about Japan?",opts:["Japan was badly affected","Japan's silk exports to the USA fell sharply","Japan had problems in the 1930s"],a:1,why:"It names a product and a trading partner."},
   {q:"Which best explains the effect on Germany?",opts:["The Depression was bad","Unemployment rose, so voters turned to the Nazis, who wanted to overturn the peace treaties","Germany was angry"],a:1,why:"It has a cause, an effect and a link to the League's problem."},
   {q:"Which is best linked to ‘made the League's work more difficult’?",opts:["The Depression began in 1929","Countries became more concerned with themselves, so they were less willing to support League action","Many people lost their jobs"],a:1,why:"It answers the question asked."}]}
 ]},
 {id:"think",label:"Think",blocks:[
  {type:"chain",h:"Follow the Depression",intro:"Build the chain one link at a time. Choose what happened next.",start:"Wall Street Crash, 1929",
   steps:[
   {ask:"What happened to American loans to Europe?",opts:["They stopped","They doubled","They were given to the League"],a:0,hint:"Think about the Dawes Plan, p.39."},
   {ask:"What did that do to businesses and jobs?",opts:["Businesses went bankrupt and unemployment rose","Wages rose","Nothing changed"],a:0},
   {ask:"How did governments respond?",opts:["They put up tariffs","They disarmed","They joined the League"],a:0},
   {ask:"What happened to trade?",opts:["It fell further","It recovered","It stayed the same"],a:0},
   {ask:"Why does that make the League's job harder?",opts:["Countries put their own economy first and were less willing to act together","Countries trusted the League more","The League gained an army"],a:0}],
   finish:"Now choose Japan or Germany and write your own version in your notebook."},
  {type:"prompt",h:"Figure 2: one country at a time",intro:"Use Figure 2 on p.43. Write in your notebook, then compare.",items:[
   {fact:"Japan's silk exports to the USA collapsed.",ask:"How did that make the League's job harder?",hints:["What happened to farmers and unemployment?","Who gained influence in Japan?","What did the army want to do abroad?"],example:"Falling silk exports hit Japanese farmers hard, so army nationalists argued that seizing Manchuria's resources was the answer, which made Japan less willing to obey the League."},
   {fact:"Unemployment in Germany rose as US loans stopped.",ask:"How did that make the League's job harder?",hints:["Which parties gained support?","What did they say about the peace treaties?","What would this do to the League's aim of disarmament?"],example:"Unemployment helped the Nazis, who wanted to overturn the peace treaties and rearm, which threatened the League's work on peace and disarmament."},
   {fact:"The USA and Britain put their own economies first.",ask:"How did that make the League's job harder?",hints:["Who was strong enough to stand up to an aggressor?","What was their ‘low priority’?"],example:"With the USA and Britain busy with their own economies, no strong member was ready to lead action against an aggressor."}]},
  {type:"prompt",h:"Why Manchuria?",intro:"Use the map on p.44.",items:[
   {fact:"Manchuria had iron, coal and timber, and Japan did not.",ask:"Why was this more important during the Depression?",hints:["What was happening to trade and tariffs?","What would Japan gain by owning its own supply?"],example:"As tariffs cut trade, controlling Manchuria's raw materials let Japan supply its industry without relying on other countries."},
   {fact:"Japan already controlled the South Manchurian Railway.",ask:"How did that make an invasion easier?",hints:["What forces were already there?","What excuse could Japan give?"],example:"It gave Japan troops in place and an excuse to ‘protect its interests’, so invasion could begin from within."}]}
 ]},
 {id:"write",label:"Write",blocks:[
  {type:"brief",h:"Paragraph (a)",label:"Question (a)",mins:8,q:["How did the ",{w:"Depression",m:"The economic crisis after 1929: loans stopped, unemployment, tariffs."}," make the League's work ",{w:"more difficult",m:"Not ‘what was the Depression?’. Show how it blocked the League."},"?"],
   rules:[["Start: ","the Depression made the League's work more difficult because…"],["Use: ","ONE country (Japan or Germany) and two facts from Figure 2."],["End: ","what that meant for the League."]],
   nudges:["Are you describing the Depression, or explaining what it did to the League?","Have you used a precise fact from Figure 2 for your country?","After the fact, have you said ‘This meant that…’?","Does your last sentence mention the League?"]},
  {type:"brief",h:"Paragraph (b)",label:"Question (b)",mins:8,q:["Why did ",{w:"Japan",m:"The aggressor in Manchuria, 1931."}," invade ",{w:"Manchuria",m:"Region of north-east China with railways and raw materials."}," in 1931?"],
   rules:[["Start: ","one reason Japan invaded Manchuria was…"],["Use: ","Figure 2 (p.43) and ‘Background’ (p.44)."],["End: ","therefore, Japan invaded because…"]],
   nudges:["Which of Manchuria's resources did Japan lack?","How did the Depression make this reason more urgent?","In 2024 the best answers explained HOW the Depression hit Japan. Did you?"]}
 ]},
 {id:"review",label:"Review",blocks:[
  {type:"check",h:"Check your paragraph (a)",items:["The first sentence answers the question","Only ONE country","Two precise facts from Figure 2","‘This meant that…’ after each","The paragraph ends with what happened to the League's work"],bands:[{min:0,t:"Keep going."},{min:3,t:"Getting there."},{min:4,t:"Strong."},{min:5,t:"Secure."}]},
  {type:"model",h:"Compare with a model",models:[
   {title:"Model (a): the Depression and Japan",q:"How did the Depression make the League's work more difficult?",paras:[[
    {k:"p",t:"The Depression made the League's work more difficult because it pushed Japan towards aggression.",note:"The answer in sentence one."},
    {k:"e",t:"Japan's silk exports to the USA collapsed, hurting farmers and raising unemployment.",note:"A precise fact from Figure 2."},
    {k:"x",t:"This meant that army leaders and nationalists argued that Japan must seize land and resources abroad, so Japan was less willing to obey the League.",note:"‘This meant that…’ links the fact to a consequence."},
    {k:"e",t:"At the same time, the USA and Britain put their own economies first.",note:"A second, different point."},
    {k:"x",t:"This meant that the countries that might have stopped Japan were distracted.",note:"Explains why the League could not respond."},
    {k:"l",t:"As a result, the League faced an aggressive member with no strong supporters to stop it.",note:"Link back to the question."}]]},
   {title:"Model (b): why Japan invaded Manchuria",q:"Why did Japan invade Manchuria in 1931?",paras:[[
    {k:"p",t:"One reason Japan invaded Manchuria was to gain raw materials that the Depression had made urgent.",note:"A reason, not a story."},
    {k:"e",t:"Manchuria had iron, coal and timber, which Japan lacked.",note:"Precise fact from p.44."},
    {k:"x",t:"This meant that by controlling Manchuria, Japan could supply its own industry without relying on trade that the Depression and tariffs had damaged.",note:"Links the fact to the Depression."},
    {k:"e",t:"Japan also already controlled the South Manchurian Railway.",note:"A second fact."},
    {k:"x",t:"This meant that Japan had troops in place and an excuse to protect its interests, which made invasion easier.",note:"Shows how."},
    {k:"l",t:"Therefore, the Depression turned a long-standing interest into a reason to invade.",note:"Link."}]]}]},
  {type:"twin",h:"Write another",twins:[
   {label:"Twin (a)",q:"How did the Depression make the League's work more difficult? Use <b>Germany</b> this time.",change:"Same question, other country. The Figure 2 facts change.",mins:8,facts:["US loans stopped, so German businesses failed","Unemployment rose","The Nazis, who wanted to overturn the peace treaties, gained support"]},
   {label:"Twin (b)",q:"Why did <b>Britain and France</b> not stand up to Japan?",change:"The focus moves from Japan to the League's members.",mins:8,facts:["Britain wanted good relations with Japan","They would not risk war","Manchuria was far from Geneva","Sanctions were meaningless without the USA"]}]}
 ]}
 ]
});
</script></body></html>
